<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sabor Divino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div id="loginForm">
            <h2>🔐 Área Administrativa</h2>
            <form id="formLogin">
                <div class="form-group">
                    <label for="senha-login">Senha:</label>
                    <input type="password" id="senha-login" name="senha" placeholder="Digite a senha" required>
                    <button type="submit">Entrar</button>
                </div>
            </form>
        </div>

        <div id="adminPanel" style="display: none;">
            <nav class="admin-nav">
                <button data-secao="estoque" class="nav-btn">Gerenciar Estoque</button>
                <button data-secao="produtos" class="nav-btn">Gerenciar Produtos</button>
                <button data-secao="senha" class="nav-btn">Alterar Senha</button>
                <button data-secao="relatorios" class="nav-btn">📊 Relatórios</button>
            </nav>

            <div id="estoqueSecao" class="secao-admin">
                <h2>📦 Gerenciar Estoque</h2>
                <div id="estoqueList"></div>
                <button type="button" id="btnSalvarEstoque">Salvar Alterações no Estoque</button>
            </div>

            <div id="produtosSecao" class="secao-admin" style="display: none;">
                <h2>🛍️ Gerenciar Produtos</h2>
                <div class="form-group">
                    <label for="categoriaProduto">Filtrar por Categoria:</label>
                    <select id="categoriaProduto">
                        <option value="trufas">Trufas</option>
                        <option value="mousses">Mousses</option>
                        <option value="empadas">Empadas</option>
                    </select>
                </div>
                <div id="listaProdutosAdmin"></div>
                <div class="button-group">
                    <button type="button" id="btnAdicionarProduto" class="add-btn">+ Novo Produto</button>
                    <button type="button" id="btnSalvarProdutos" class="save-btn">💾 Salvar Alterações nos
                        Produtos</button>
                </div>
            </div>

            <div id="relatoriosSecao" class="secao-admin" style="display: none;">
                <h2>📊 Relatórios</h2>
                <p>Seção de relatórios em construção.</p>
            </div>

            <div id="senhaSecao" class="secao-admin" style="display: none;">
                <h2>🔐 Alterar Senha</h2>
                <form id="formAlterarSenha">
                    <div class="form-group">
                        <label for="senhaAtual">Senha Atual:</label>
                        <input type="password" id="senhaAtual" required>
                    </div>
                    <div class="form-group">
                        <label for="novaSenha">Nova Senha:</label>
                        <input type="password" id="novaSenha" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Nova Senha:</label>
                        <input type="password" id="confirmarSenha" required>
                    </div>
                    <button type="submit">Salvar Nova Senha</button>
                </form>
            </div>
        </div>
    </div>

    <script src="produtos.js" defer></script>
    <script src="config.js" defer></script>
    <script src="admin.js" defer></script>
</body>

</html>
