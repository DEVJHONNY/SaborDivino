<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sabor Divino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos simples podem continuar aqui ou ir para styles.css */
        .error-hint {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        form {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="loginForm">
            <h2>🔐 Área Administrativa</h2>
            <form id="formLogin">
                <div class="form-group">
                    <label for="senha-login">Senha:</label>
                    <input type="password" id="senha-login" name="senha" placeholder="Digite a senha" required>
                    <button type="submit">Entrar</button>
                </div>
            </form>
        </div>

        <div id="adminPanel" style="display: none;">
            <nav class="admin-nav">
                <button data-secao="estoque" class="nav-btn">Gerenciar Estoque</button>
                <button data-secao="produtos" class="nav-btn">Gerenciar Produtos</button>
                <button data-secao="senha" class="nav-btn">Alterar Senha</button>
                <button data-secao="relatorios" class="nav-btn">📊 Relatórios</button>
            </nav>

            <div id="estoqueSecao" class="secao-admin">
                <h2>📦 Gerenciar Estoque</h2>
                <button type="button" id="btnSincronizar" class="sync-btn">🔄 Sincronizar com GitHub</button>
                <div id="estoqueList"></div>
                <button type="button" id="btnSalvarEstoque">Salvar Alterações</button>
            </div>

            <div id="produtosSecao" class="secao-admin" style="display: none;">
                <h2>🛍️ Gerenciar Produtos</h2>
            </div>

            <div id="relatoriosSecao" class="secao-admin" style="display: none;">
                <h2>📊 Relatórios</h2>
            </div>

            <div id="senhaSecao" class="secao-admin" style="display: none;">
                <h2>🔐 Alterar Senha</h2>
            </div>
        </div>
    </div>

    <script src="produtos.js" defer></script>
    <script src="config.js" defer></script>
    <script src="sistema/loading.js" defer></script>
    <script src="sistema/backup.js" defer></script>
    <script src="sistema/github-api.js" defer></script>
    <script src="sistema/sync.js" defer></script>
    <script src="sistema/relatorios.js" defer></script>
    <script src="controllers/ticket-controller.js" defer></script>
    <script src="controllers/cliente-controller.js" defer></script>

    <script src="admin.js" defer></script>

</body>

</html>
